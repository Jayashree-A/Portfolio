<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body{
            background:black;
            color:white;
            font-family:Arial;
            padding:30px;
        }

        h1{
            color:#00ff66;
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:30px;
        }

        th, td{
            border:1px solid #00ff66;
            padding:12px;
            text-align:left;
        }

        th{
            background:#111;
            color:#00ff66;
        }

        tr:nth-child(even){
            background:#111;
        }
    </style>
</head>
<body>

<h1>Contact Messages</h1>

<table>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Message</th>
</tr>

{% for row in data %}
<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
